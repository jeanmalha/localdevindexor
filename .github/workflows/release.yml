name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y jq bats shellcheck zsh
      - name: Lint
        run: shellcheck reindex.sh list.sh toggle-star.sh preview.sh edit-summary.sh install.sh
      - name: Test
        run: bats tests/

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *"alpha"* ]] || \
             [[ "${{ github.ref_name }}" == *"beta"* ]] || \
             [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            $prerelease_flag \
            --title "${{ github.ref_name }}" \
            --generate-notes
